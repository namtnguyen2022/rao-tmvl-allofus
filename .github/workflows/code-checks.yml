name: Code and publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check publication contents and Python syntax
        run: python scripts/check_repository.py
      - name: Test publication guard with synthetic examples
        run: python scripts/test_publication_guard.py
